name: Build and Release OOXML Validator Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.dotnet_rid }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet_rid: win-x64
            runner: ubuntu-latest
          - dotnet_rid: win-arm64
            runner: ubuntu-latest
          - dotnet_rid: linux-x64
            runner: ubuntu-latest
          - dotnet_rid: linux-arm64
            runner: ubuntu-latest
          - dotnet_rid: osx-x64
            runner: macos-latest
          - dotnet_rid: osx-arm64
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ooxml-validator-dotnet/ooxml-validator.csproj

      - name: Publish self-contained single file
        run: |
          dotnet publish ooxml-validator-dotnet/ooxml-validator.csproj \
            -c Release \
            -r ${{ matrix.dotnet_rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o out/${{ matrix.dotnet_rid }}

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          if [[ "${{ matrix.dotnet_rid }}" == win-* ]]; then
            BIN_NAME="ooxml-validator.exe"
            OUT_NAME="ooxml-validator-${{ matrix.dotnet_rid }}.exe"
          else
            BIN_NAME="ooxml-validator"
            OUT_NAME="ooxml-validator-${{ matrix.dotnet_rid }}"
          fi
          mv "out/${{ matrix.dotnet_rid }}/${BIN_NAME}" "artifacts/${OUT_NAME}"
          chmod +x "artifacts/${OUT_NAME}" || true

      - name: Ad-hoc codesign (macOS only)
        if: startsWith(matrix.dotnet_rid, 'osx-')
        run: |
          OUT_NAME="ooxml-validator-${{ matrix.dotnet_rid }}"
          codesign --force --sign - --timestamp=none "artifacts/${OUT_NAME}"
          codesign --verify --verbose "artifacts/${OUT_NAME}"

      # Only the binaries the runner can execute; the cross-compiled ones are checked at install
      # time by the smoke test in npm-publish.
      - name: Smoke test the binary
        if: matrix.dotnet_rid == 'linux-x64' || matrix.dotnet_rid == 'osx-arm64'
        run: |
          set -euo pipefail
          BIN="artifacts/ooxml-validator-${{ matrix.dotnet_rid }}"
          "$BIN" test/fixtures/minimal.pptx | grep -q '"ok": true'
          "$BIN" test/fixtures/office2010-only.docx Office2010 | grep -q '"ok": true'
          "$BIN" test/fixtures/office2010-only.docx Office2007 | grep -q '"ok": false'
          if "$BIN" test/fixtures/minimal.pptx NotAVersion; then
            echo "Expected a nonzero exit for an unknown Office version"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ooxml-validator-${{ matrix.dotnet_rid }}
          path: artifacts/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: collected

      - name: Display collected files
        run: ls -R collected

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: collected/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Determine version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify all 15 versions are in sync
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"

          # 1. Root package.json .version must match the tag.
          root=$(jq -r .version package.json)
          if [ "$root" != "$V" ]; then
            echo "Tag v$V does not match package.json version $root"
            exit 1
          fi

          # 2. Both version fields in the lockfile, so `npm ci` cannot drift from package.json.
          for lockVersion in "$(jq -r .version package-lock.json)" "$(jq -r '.packages[""].version' package-lock.json)"; do
            if [ "$lockVersion" != "$V" ]; then
              echo "package-lock.json version is $lockVersion, expected $V"
              exit 1
            fi
          done

          # 3 & 4. All 6 optionalDependencies pins and 6 sub-package versions must match.
          for rid in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            pinned=$(jq -r ".optionalDependencies.\"@xarsh/ooxml-validator-$rid\"" package.json)
            if [ "$pinned" != "$V" ]; then
              echo "package.json pins @xarsh/ooxml-validator-$rid to $pinned, expected $V"
              exit 1
            fi
            sub=$(jq -r .version "npm/$rid/package.json")
            if [ "$sub" != "$V" ]; then
              echo "npm/$rid/package.json version is $sub, expected $V"
              exit 1
            fi
          done

          echo "All 15 versions match $V"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: collected

      - name: Install dependencies
        run: npm install --ignore-scripts --omit=optional --no-package-lock --no-audit --no-fund

      - name: Build parent package
        run: npm run build

      - name: Stage platform binaries
        run: |
          set -euo pipefail
          stage() {
            local dotnet_rid="$1" npm_rid="$2" ext=""
            if [[ "$dotnet_rid" == win-* ]]; then ext=".exe"; fi
            cp "collected/ooxml-validator-${dotnet_rid}/ooxml-validator-${dotnet_rid}${ext}" "npm/${npm_rid}/ooxml-validator${ext}"
            chmod +x "npm/${npm_rid}/ooxml-validator${ext}"
          }
          stage osx-arm64   darwin-arm64
          stage osx-x64     darwin-x64
          stage linux-arm64 linux-arm64
          stage linux-x64   linux-x64
          stage win-arm64   win32-arm64
          stage win-x64     win32-x64

      # Install what is about to be published into a clean project and use it, so a broken
      # tarball, bin entry, or binary resolution is caught before anything reaches the registry.
      - name: Smoke test the packed artifacts
        run: |
          set -euo pipefail
          PKGS="${RUNNER_TEMP}/pkgs"
          mkdir -p "$PKGS"
          npm pack --pack-destination "$PKGS"
          (cd npm/linux-x64 && npm pack --pack-destination "$PKGS")

          FIXTURES="${GITHUB_WORKSPACE}/test/fixtures"
          mkdir -p "${RUNNER_TEMP}/smoke"
          cd "${RUNNER_TEMP}/smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$PKGS"/*.tgz

          npx ooxml-validator "${FIXTURES}/minimal.pptx" | grep -q '"ok": true'
          npx ooxml-validator "${FIXTURES}/office2010-only.docx" --officeVersion Office2010 > /dev/null
          if npx ooxml-validator "${FIXTURES}/office2010-only.docx" --officeVersion Office2007 > /dev/null; then
            echo "Expected exit 1 when validating against Office2007"
            exit 1
          fi
          node --input-type=module -e "
            import { validateFile, isValid } from '@xarsh/ooxml-validator'
            import assert from 'node:assert/strict'
            const r = await validateFile('${FIXTURES}/office2010-only.docx', { officeVersion: 'Office2007' })
            assert.equal(r.ok, false)
            assert.equal(r.errors[0].errorType, 'Schema')
            assert.equal(await isValid('${FIXTURES}/minimal.pptx'), true)
          "

      # Skips anything already on the registry so a rerun after a partial failure can finish the
      # release instead of dying on E403 and stranding the versions it did publish.
      - name: Publish platform packages
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          for npm_rid in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            name="@xarsh/ooxml-validator-${npm_rid}"
            if [ "$(npm view "${name}@${VERSION}" version 2>/dev/null || true)" = "$VERSION" ]; then
              echo "${name}@${VERSION} is already published, skipping"
              continue
            fi
            (cd "npm/${npm_rid}" && npm publish --provenance --access public)
          done

      # The root pins each platform package to an exact version. If one is missing, npm treats it
      # as an optional dependency that simply did not install, and users on that platform get a
      # runtime failure instead of an install error.
      - name: Verify every platform package is live
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          for npm_rid in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            name="@xarsh/ooxml-validator-${npm_rid}"
            if [ "$(npm view "${name}@${VERSION}" version 2>/dev/null || true)" != "$VERSION" ]; then
              echo "${name}@${VERSION} is not on the registry; not publishing the root package"
              exit 1
            fi
          done

      - name: Publish parent package
        run: npm publish --provenance --access public
